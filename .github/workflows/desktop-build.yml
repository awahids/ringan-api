# Builds Ringan API desktop installers for Windows and macOS.
#  - Manual run (Actions tab -> "Desktop build" -> Run workflow): installers are uploaded as workflow artifacts.
#  - Pushing a version tag (v1.2.0, made by `npm run release -- 1.2.0`): additionally publishes a GitHub Release
#    with the installers and the CHANGELOG.md notes. The app's update notification reads these releases.
# Builds are unsigned unless signing secrets are configured.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME tidak sama dengan package.json ($v)"; exit 1; }
      - run: npm ci
      - run: node test/smoke.js
      - run: npm run ${{ matrix.script }}
        env:
          # Unsigned build; installers are uploaded as workflow artifacts (scripts use --publish never).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ringan-api-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog-section.js "$GITHUB_REF_NAME" > notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          gh release create "$GITHUB_REF_NAME" out/* --title "Ringan API $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
